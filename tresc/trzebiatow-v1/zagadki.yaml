# TEKST ROBOCZY - NIE JEST TO FINALNA WERSJA FABULY.
- id: zagadka_hansken
  nazwa: Robocza zagadka obserwacyjna Hansken
  klasyfikacja: FABULARYZOWANE
  idZrodla:
    - wzp_hansken
  wymagaWeryfikacjiTerenowej: true
  idLokalizacji: hansken
  pytanie: Przyjrzyj się sgraffito. Który szczegół da się opisać jako własną
    obserwację, a co jest tylko przypuszczeniem? Zadanie i odpowiedź wymagają
    rekonesansu.
  odpowiedz: null
  podpowiedzi:
    - Oddziel to, co widzisz, od tego, co dopowiada opowieść.
    - Porównaj własną notatkę z opisem źródłowym; nie dopisuj detalu, którego
      nie potrafisz rozpoznać.
  konsekwencje:
    ROZWIAZANA_SAMODZIELNIE:
      zmiany:
        - rodzaj: DODAJ_PRZEDMIOT
          id: fragment_kroniki_hansken
        - rodzaj: ZMIEN_POWINOWACTWO
          os: dowod
          wartosc: 2
      efekty:
        - rodzaj: POKAZ_KOMUNIKAT
          tekst: Zapisujesz własną obserwację i otrzymujesz fragment Kroniki. Jej terenowy
            szczegół nadal wymaga rekonesansu.
    ROZWIAZANA_Z_PODPOWIEDZIA:
      zmiany:
        - rodzaj: DODAJ_PRZEDMIOT
          id: fragment_kroniki_hansken
        - rodzaj: ZMIEN_POWINOWACTWO
          os: dowod
          wartosc: 1
      efekty:
        - rodzaj: POKAZ_KOMUNIKAT
          tekst: Podpowiedź pomogła uporządkować notatkę. Fragment Kroniki pozostaje z
            tobą.
    ROZWIAZANA_Z_POMOCA:
      zmiany: []
      efekty:
        - rodzaj: POKAZ_KOMUNIKAT
          tekst: Wspólna wskazówka prowadzi dalej. W zapisie zachowujesz perspektywę
            źródłową, bez fragmentu za obserwację.
    POMINIETA:
      zmiany: []
      efekty:
        - rodzaj: POKAZ_KOMUNIKAT
          tekst: Zostawiasz miejsce na późniejszą obserwację. Możesz kontynuować bez
            fragmentu.
    NIEUDANA:
      zmiany: []
      efekty:
        - rodzaj: POKAZ_KOMUNIKAT
          tekst: Świadomie kończysz zadanie bez rozstrzygnięcia. Pytanie zostaje w
            Kronice; główna opowieść trwa dalej.
  moznaPominac: true
  moznaZakonczycBezRozwiazania: true
  pomoc:
    tekst: Możesz oprzeć notatkę na opisie źródłowym. Taka pomoc pozwala iść dalej
      bez zatwierdzania detalu sgraffito.
    pozwalaZaliczyc: true
  typ: OBSERWACJA
  potwierdzenie: Potwierdzam wykonanie roboczej obserwacji — bez zatwierdzania
    detalu ani historycznej interpretacji.
- id: zagadka_baszta
  nazwa: Co jest obiektem, a co legendą?
  klasyfikacja: FABULARYZOWANE
  idZrodla:
    - gmina_zabytki
  wymagaWeryfikacjiTerenowej: false
  idLokalizacji: baszta
  pytanie: "Który element tego opisu należy oznaczyć jako legendę: zachowaną
    basztę obronną czy opowieść o misce gorącej kaszy?"
  podpowiedzi:
    - Rozdziel to, co dotyczy budowli, od opowieści o wydarzeniu.
    - Przekaz o gorącej kaszy objaśnia nazwę baszty; jest legendą.
  konsekwencje:
    ROZWIAZANA_SAMODZIELNIE:
      zmiany:
        - rodzaj: USTAW_FLAGE
          id: rozrozniono_warstwy
          wartosc: true
        - rodzaj: ZMIEN_POWINOWACTWO
          os: pamiec
          wartosc: 1
      efekty: []
    ROZWIAZANA_Z_PODPOWIEDZIA:
      zmiany:
        - rodzaj: USTAW_FLAGE
          id: rozrozniono_warstwy
          wartosc: true
        - rodzaj: ZMIEN_POWINOWACTWO
          os: pamiec
          wartosc: 1
      efekty: []
    ROZWIAZANA_Z_POMOCA:
      zmiany:
        - rodzaj: USTAW_FLAGE
          id: rozrozniono_warstwy
          wartosc: true
        - rodzaj: ZMIEN_POWINOWACTWO
          os: pamiec
          wartosc: 1
      efekty: []
    POMINIETA:
      zmiany:
        - rodzaj: USTAW_FLAGE
          id: rozrozniono_warstwy
          wartosc: false
      efekty: []
    NIEUDANA:
      zmiany:
        - rodzaj: USTAW_FLAGE
          id: rozrozniono_warstwy
          wartosc: false
      efekty: []
  moznaPominac: true
  moznaZakonczycBezRozwiazania: true
  pomoc:
    tekst: Opis obiektu to fakt, a miska kaszy należy do legendy. Możesz skorzystać
      z tej wskazówki i kontynuować.
    pozwalaZaliczyc: true
  typ: WYBOR
  odpowiedzi:
    - id: baszta_obronna
      tekst: Zachowana baszta obronna
    - id: opowiesc_o_misce_goracej_kaszy
      tekst: Opowieść o misce gorącej kaszy
  poprawneOdpowiedzi:
    - opowiesc_o_misce_goracej_kaszy
  limitProb: 3
  alternatywneZaliczenia:
    - id: notatka_z_fragmentem
      nazwa: Skorzystaj z notatki i fragmentu Kroniki
      warunek:
        rodzaj: posiadaPrzedmiot
        id: fragment_kroniki_hansken
      wynik: ROZWIAZANA_Z_POMOCA
    - id: dwie_notatki
      nazwa: Zastosuj rozróżnienie z dwóch notatek
      warunek:
        rodzaj: odkrytoScenke
        id: scenka_dwie_notatki
      wynik: ROZWIAZANA_SAMODZIELNIE
