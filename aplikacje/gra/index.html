<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f3ed" />
    <script>
      (() => {
        let motyw;
        try { motyw = localStorage.getItem("trzebiatow.motyw.v1"); } catch {}
        if (motyw !== "light" && motyw !== "dark") {
          motyw = typeof matchMedia === "function" && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = motyw;
        document.querySelector('meta[name="theme-color"]').content = motyw === "dark" ? "#242720" : "#f3efe4";
      })();
    </script>
    <title>Tajemnice Trzebiatowa</title>
  </head>
  <body>
    <div id="korzen"></div>
    <script type="module" src="/src/start.tsx"></script>
  </body>
</html>
